name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check code with ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest

      # Headless demo: run the three tests with simulated instruments and make
      # the reports (they say "Run mode: SIMULATION"). bash -e stops the step if
      # a run does not PASS or a report can't be written.
      - name: Demo run in simulation with reports
        if: always()
        shell: bash
        run: |
          python cli.py --test dynamic_output_response --simulate --report
          python cli.py --test vds_turnoff --simulate --report
          python cli.py --test vds_ovp --simulate --report

      - name: Upload the simulation demo reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulation-demo-reports
          path: output/
          if-no-files-found: error
