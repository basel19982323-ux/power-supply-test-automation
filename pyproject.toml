[project]
name = "dynamic-load-test"
version = "0.1.0"
description = "Desktop app for bench instrument test automation (first test: USB-C PD Dynamic Output Response)."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "Pillow>=10.0",
    "pyvisa>=1.14",
]

[project.optional-dependencies]
hardware = ["pyvisa-py>=0.7", "pyusb", "psutil", "zeroconf"]
dev = ["pytest>=8.0", "pyinstaller>=6.0", "ruff==0.17.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
